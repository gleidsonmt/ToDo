javafx {
    version = "23.0.2"
    modules = ['javafx.controls', 'javafx.web', 'javafx.fxml', 'javafx.graphics', 'javafx.swing']
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}

jlink {
    // Loading a custom file in build.gradle
    options = ['--strip-debug', '--compress', '2', '--no-header-files', '--no-man-pages']
    launcher {
        name = 'JavaFx ToDo'
    }
    jpackage {

        imageOptions = [
                '--icon', 'logo_128.ico'
        ]
        installerType = 'exe'
        appVersion = version
        installerOptions = [
                '--description', "ToDo app made in JavaFx UI Toolkit.",
                '--copyright', 'Copyright © 2026 GLEIDSON NEVES DA SILVEIRA',
                '--vendor', 'Gleidson Neves',
                '--icon', 'logo_128.ico',
//                '--win-console',
                '--win-shortcut'
        ]

        addExtraDependencies("javafx")
    }
}
