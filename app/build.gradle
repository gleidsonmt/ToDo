//}

tasks.register('debug') {
    group = 'application'

    tasks.run.configure {
        args = ['listenCss', 'nodeAnalyze', 'level-all']
    }

    dependsOn 'run'
}

tasks.register('runWithTools') {
    group = 'initialize'
    tasks.run.configure {
        args = ['listenCss', 'nodeAnalyze']
    }
    dependsOn 'run'
}

tasks.register('listenCss') {
    group = 'initialize'
    tasks.run.configure {
        args = ['listenCss']
    }
    dependsOn 'run'
}

tasks.register('analyzeNodes') {
    group = 'initialize'
    tasks.run.configure {
        args = ['nodeAnalyze']
    }
    dependsOn 'run'
}

tasks.register('logger') {
    group = 'application'
    tasks.run.configure {
        args = ['logger', 'all']
    }
    dependsOn 'run'
}

tasks.register('info') {
    group = 'logger'
    tasks.run.configure {
        args = ['logger', 'level-info']
    }
    dependsOn 'run'
}

tasks.register('config') {
    group = 'logger'
    tasks.run.configure {
        args = ['logger', 'level-config']
    }
    dependsOn 'run'
}

javafx {
    version = "23.0.2"
    modules = ['javafx.controls', 'javafx.web', 'javafx.fxml', 'javafx.graphics', 'javafx.swing']
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}

jlink {
    options = ['--strip-debug', '--compress', '2', '--no-header-files', '--no-man-pages']
    launcher {
        name = 'app'
    }
    jpackage {

        imageOptions = [
                '--icon', 'logo_128.ico'
        ]
        installerType = 'exe'
        appVersion = version
        installerOptions = [
                '--description', "A todo made in JavaFx UI Toolkit.",
                '--copyright', 'Copyright © 2026 GLEIDSON NEVES DA SILVEIRA'
                , '--icon', 'logo_128.ico'
        ]

        addExtraDependencies("javafx")
    }
}

