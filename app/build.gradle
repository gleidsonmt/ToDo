plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'java'
    id 'org.javamodularity.moduleplugin' version '2.0.0'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'org.beryx.jlink' version '3.1.1'
    id 'application'
}

version '0.0.1'

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
    maven {
        url "https://sandec.jfrog.io/artifactory/repo"
    }
    maven { url 'https://jitpack.io' }
}

// ignore all other run projects
// needs to be refactoring in the future
subprojects {
    tasks.configureEach { task ->
        if (task.name.contains("run")) {
            task.enabled = false
        }
    }
}

dependencies {
    // --------------------- Tests ------------------------

    // Use JUnit Jupiter for testing.
    testImplementation libs.junit.jupiter
    // This dependency is used by the application.
    implementation libs.guava

    // --------------------- Runtime ------------------------

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    compileOnly("org.jetbrains:annotations:26.1.0")
    testCompileOnly("org.jetbrains:annotations:26.1.0")

    // --------------------- External librabries  ------------------------
//    implementation 'com.github.hervegirod:fxsvgimage:1.7'

    // Add this for CSS stylesheet support
//    implementation 'com.github.hervegirod:fxsvgimage:1.7:cssparser'


    implementation project(":glad")
    implementation 'io.github.classgraph:classgraph:4.8.165'

    implementation("org.yaml:snakeyaml:2.5")

    implementation("com.mysql:mysql-connector-j:9.6.0")

//    implementation 'com.dlsc.gemsfx:gemsfx:3.10.1'
    implementation 'com.dlsc.gemsfx:gemsfx:2.16.0'

    // ------------------ Local libraries --------
    implementation fileTree(dir: 'lib', include: ['*.jar'])

}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(23)
    }
    // The line resolves the problem with the Java Language Server in VS Code, but it is not needed for gradle run. 
    // Witouth this line, gradle run works, but the Java Language Server in VS Code reports “module not found” for module jars that are on the Gradle module path.
//    modularity.inferModulePath = true
}

